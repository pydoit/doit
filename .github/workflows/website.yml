name: Website

on:
  push:
    branches: [master, test]
  pull_request:
    branches: [master, test]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install hunspell hunspell-en-us
      - uses: actions/checkout@v7
      # uv.lock is not committed, cache is keyed on pyproject.toml instead
      # v7 is the last floating major tag published, newer ones are full pins only
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --group dev --group docs
      - run: uv run doit -v2 website
      - uses: actions/upload-artifact@v7
        with:
          name: Website
          path: ./doc/_build
