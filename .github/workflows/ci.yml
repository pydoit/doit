name: CI

on:
  push:
    branches: [master, test]
  pull_request:
    branches: [master, test]

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        python-version: ['3.10', '3.11', '3.12', '3.13', 'pypy-3.11']
        exclude:
          - os: windows
            python-version: pypy3
    steps:
      - if: ${{ matrix.os == 'ubuntu' }}
        run: sudo apt-get install strace
      - uses: actions/checkout@v7
      # uv.lock is not committed, cache is keyed on pyproject.toml instead
      # v7 is the last floating major tag published, newer ones are full pins only
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      # PyPy bundles cffi which declares pycparser as dependency but doesn't ship it
      - if: ${{ startsWith(matrix.python-version, 'pypy') }}
        run: uv pip install pycparser
      - run: uv run doit pyflakes
      - run: uv run doit codestyle
      # rut writes unicode through a wrapper over a dup of stdout, which picks
      # locale.getpreferredencoding() (cp1252 on Windows) -> UnicodeEncodeError.
      # PYTHONIOENCODING does not affect that, only UTF-8 mode does.
      - run: uv run rut -vv
        env:
          PYTHONUTF8: "1"
      - if: ${{ matrix.os == 'ubuntu' && matrix.python-version == '3.11' }}
        run: uv run doit coverage
      - if: ${{ matrix.os == 'ubuntu' && matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
